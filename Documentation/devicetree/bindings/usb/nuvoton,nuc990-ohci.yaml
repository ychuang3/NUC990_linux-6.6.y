%YAML 1.2
---
$id: "http://devicetree.org/schemas/usb/nuvoton,nuc990-ohci.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Nuvoton NUC990 OHCI Host Controller

maintainers:
  - Jacky Huang <your_email@nuvoton.com>

properties:
  compatible:
    const: nuvoton,nuc990-ohci

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1
    description: Handle to USB Host clock.

required:
  - compatible
  - reg
  - interrupts
  - clocks

additionalProperties: false

examples:
  - |
    ohci@b0014000 {
        compatible = "nuvoton,nuc990-ohci";
        reg = <0xb0014000 0x1000>;
        interrupts = <53>;
        clocks = <&clk USBH_GATE>;
    };

