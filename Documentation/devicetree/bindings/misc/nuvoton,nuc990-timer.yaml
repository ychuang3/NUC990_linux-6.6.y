%YAML 1.2
---
$id: "http://devicetree.org/schemas/misc/nuvoton,nuc990-timer.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Nuvoton NUC990 Timer Controller

maintainers:
  - ZY Chen <zychen@nuvoton.com>

description: |
  General-purpose timer controller for Nuvoton NUC990 platforms.

properties:
  compatible:
    const: nuvoton,nuc990-timer

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  assigned-clocks:
    maxItems: 1

  port-number:
    description: Timer channel index.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 3
    required: true

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - port-number

additionalProperties: false

examples:
  # timer control module node:
  - |
    timer0: timer@b0050000 {
        compatible = "nuvoton,nuc990-timer";
        reg = <0xb0050000 0x100>;
        interrupts = <18 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&clk TMR0_GATE>;
        port-number = <0>;
    };
