%YAML 1.2
---
$id: "http://devicetree.org/schemas/misc/nuvoton,nuc990-timer.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Nuvoton NUC990 External Bus Interface(EBI) Controller

maintainers:
  - ZY Chen <zychen@nuvoton.com>

description: |
  This chip is equipped with an external bus interface for external device 
  use. The EBI supports three chip selects that can connect three external 
  devices with different timing setting requirements.

properties:
  compatible:
    const: nuvoton,nuc990-ebi

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: ebi_gate

  bank:
    description: EBI chip-select bank index.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 2

  csactiveLevel:
    description: |
      Chip-select active level.
      0 = active low, 1 = active high.
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]

  datawidth:
    description: |
      External bus data width.
      0 = 8-bit, 1 = 16-bit.
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]

  MCLKDIV:
    description: |
      EBI master clock divider value.
      Maps to EBI_CTL[10:8].
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 7

  tACC:
    description: |
      Access time setting.
      Maps to EBI_TCTL[7:3].
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 31

  tAHD:
    description: |
      Address hold time.
      Maps to EBI_TCTL[10:9].
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 7

  IDLE:
    description: |
      Bus idle cycle configuration.
      Maps to EBI_TCTL[27:24] and EBI_TCTL[15:12].
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 15

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - bank
  - csactiveLevel
  - datawidth
  - MCLKDIV
  - tACC
  - tAHD
  - IDLE

additionalProperties: false

examples:
  - |
    ebi0: ebi@b0010000 {
        compatible = "nuvoton,nuc990-ebi";
        reg = <0xb0010000 0x10>;
        clocks = <&clk EBI_GATE>;
        clock-names = "ebi_gate";
        bank = <0>;
        csactiveLevel = <0>;
        datawidth = <1>;
        MCLKDIV = <2>;
        tACC = <1>;
        tAHD = <1>;
        IDLE = <3>;
    };
