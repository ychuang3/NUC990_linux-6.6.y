%YAML 1.2
---
$id: "http://devicetree.org/schemas/misc/nuvoton,nuc990-keystore.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Nuvoton NUC990 Key Store Controller

maintainers:
  - Jacky Huang <jacky.huang@nuvoton.com>

description: |
  Key Store controller in the Nuvoton NUC990 series SoCs.
  This block provides simple SRAM/OTP key storage access via
  register read/write operations.

properties:
  compatible:
    const: nuvoton,nuc990-keystore

  reg:
    maxItems: 1
    description:
      Base address and size of the hardware register block.

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: ks_gate

  interrupts:
    maxItems: 1
    description:
      Optional interrupt for event/error notification.

required:
  - compatible
  - reg
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    keystore@b001f000 {
        compatible = "nuvoton,nuc990-keystore";
        reg = <0xb001f000 0x50>;
        clocks = <&clk KS_GATE>;
        clock-names = "ks_gate";
        status = "okay";
    };

