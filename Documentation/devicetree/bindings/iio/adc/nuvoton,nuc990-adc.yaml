%YAML 1.2
---
$id: "http://devicetree.org/schemas/iio/adc/nuvoton,nuc990-adc.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Nuvoton NUC990 ADC Controller

maintainers:
  - name: Joey Lu
    email: yclu4@nuvoton.com

description: |
  ADC controller for Nuvoton NUC990 platforms. This binding describes the
  stand-alone ADC peripheral (non-touchscreen mode).

properties:
  compatible:
    const: nuvoton,nuc990-adc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  nuvoton,adc-vref:
    description: ADC reference voltage in millivolts.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1000
    maximum: 3300
    required: true

  "#io-channel-cells":
    description: Must be 1. Channel index.
    const: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - nuvoton,adc-vref
  - "#io-channel-cells"

additionalProperties: false

examples:
  - |
    adc0: adc@b0043000 {
        compatible = "nuvoton,nuc990-adc";
        reg = <0xb0043000 0x1000>;
        interrupts = <42 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&clk ADC0_GATE>;
        nuvoton,adc-vref = <3300>;
        #io-channel-cells = <1>;
        status = "okay";
    };
