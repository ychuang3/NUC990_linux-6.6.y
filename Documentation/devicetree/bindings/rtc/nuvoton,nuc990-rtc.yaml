%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/nuvoton,nuc990-rtc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton NUC990 Real Time Clock (RTC)

maintainers:
  - name: Nuvoton Technology Corporation
    email: linux-kernel@nuvoton.com

description: |
  The Nuvoton NUC990 RTC provides real-time clock and alarm functionality.
  It supports:
    - Time and calendar registers in BCD format
    - Alarm interrupt
    - Periodic tick interrupt
  The RTC is accessed via a memory-mapped register interface and requires
  a dedicated RTC gate clock.

properties:
  compatible:
    const: nuvoton,nuc990-rtc

  reg:
    maxItems: 1
    description:
      Base address and size of the RTC register block.

  interrupts:
    maxItems: 1
    description:
      RTC interrupt for alarm and periodic tick events.

  clocks:
    maxItems: 1
    description:
      RTC functional clock.

  clock-names:
    items:
      - const: rtc_gate

  nuvoton,sys:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the NUC990 system controller (syscon).

  status:
    enum:
      - okay
      - disabled

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    apb {
        rtc: rtc@b0041000 {
            compatible = "nuvoton,nuc990-rtc";
            reg = <0xb0041000 0x1000>;
            interrupts = <17 IRQ_TYPE_LEVEL_HIGH>;
            clocks = <&clk RTC_GATE>;
            clock-names = "rtc_gate";
            nuvoton,sys = <&sys>;
            status = "okay";
        };
    };
...

