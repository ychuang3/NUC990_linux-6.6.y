%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/busses/nuvoton,nuc990-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton NUC990 I2C Controller

maintainers:
  - ZY Chen <zychen@nuvoton.com>

description: |
  The Nuvoton NUC990 I2C controller supports master mode and optional
  slave mode operation. The controller is configured via Device Tree
  and supports interrupt-driven I2C transfers.

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    const: nuvoton,nuc990-i2c

  reg:
    maxItems: 1
    description:
      Base address and size of the I2C controller register space.

  interrupts:
    maxItems: 1
    description:
      Interrupt line for the I2C controller.

  clocks:
    maxItems: 1
    description:
      Input clock for the I2C controller.

  clock-frequency:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Desired I2C bus clock frequency in Hz.
      If omitted, the controller defaults to a hardware-defined
      standard speed.

  resets:
    maxItems: 1
    description:
      Reset control for the I2C controller.

required:
  - compatible
  - reg
  - interrupts
  - clocks

unevaluatedProperties: false

examples:
  - |
    i2c0: i2c@b0080000 {
        compatible = "nuvoton,nuc990-i2c";
        reg = <0xb0080000 0x1000>;
        interrupts = <24 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&clk I2C0_GATE>;
        resets = <&reset NUC990_RESET_I2C0>;
        clock-frequency = <100000>;
        #address-cells = <1>;
        #size-cells = <0>;
    };
