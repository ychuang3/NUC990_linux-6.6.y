%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/nuvoton,nuc990-i2s.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton NUC990 I2S Controller

maintainers:
  - ZY Chen <zychen@nuvoton.com>

description: |
  The I2S block supports I2S protocol when configured in
  I2S mode. It can operate as master or slave and supports
  standard audio formats with configurable sample rates.

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: nuvoton,nuc990-audio-i2s

  reg:
    maxItems: 1
    description:
      Base address and size of the I2S controller register space.

  interrupts:
    maxItems: 1
    description:
      Interrupt line for the I2S controller.

  clocks:
    maxItems: 1
    description:
      Input clocks for the I2S controller.
      Typically one for peripheral clock, optionally one for audio master clock.

  clock-names:
    type: array
    items:
      type: string
    description:
      Names corresponding to each clock in 'clocks' property.

  resets:
    maxItems: 1
    description: Reset control for the I2S controller.

required:
  - compatible
  - reg
  - interrupts
  - clocks

unevaluatedProperties: false

examples:
  - |
    i2s: i2s@b0020000 {
      compatible = "nuvoton,nuc990-audio-i2s";
      reg = <0xb0020000 0x1000>;
      interrupts = <16 IRQ_TYPE_LEVEL_HIGH>;
      clocks = <&clk I2S_GATE>;
      resets = <&reset NUC990_RESET_I2S>;
    };
