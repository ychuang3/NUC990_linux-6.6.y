%YAML 1.2
---
$id: "http://devicetree.org/schemas/spi/nuvoton,nuc990-spi.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Nuvoton NUC990 SPI Controller

maintainers:
  - name: Chi-Wen Weng
    email: cwweng@nuvoton.com

description: |
  The Nuvoton NUC990 SPI controller supports single, and dual SPI
  transfer modes and can be used to interface with SPI NOR or SPI NAND
  flash devices as well as generic SPI peripherals.

  The controller supports up to two chip selects and integrates with
  the Linux SPI controller and SPI-mem frameworks.

allOf:
  - $ref: /schemas/spi/spi-controller.yaml#

properties:
  compatible:
    const: nuvoton,nuc990-spi

  reg:
    maxItems: 1
    description:
      Base address and size of the SPI controller registers.

  interrupts:
    maxItems: 1
    description:
      SPI controller interrupt.

  clocks:
    maxItems: 1
    description:
      SPI functional clock.

  clock-names:
    items:
      - const: spi
    description:
      Name of the SPI clock.

  num-cs:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
    maximum: 2
    default: 2
    description:
      Number of supported chip selects.

  lsb:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]
    default: 0
    description:
      Set to 1 to enable LSB-first transfer.

  sleep:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Sleep cycle configuration for the SPI controller.

  txbitlen:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [8, 16, 32]
    default: 8
    description:
      SPI transfer word length in bits.

  bus-num:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      SPI bus number.

  spimode:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Default SPI mode (0-3).

  quad:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]
    default: 0
    description:
      Enable quad mode capability.

  mrxphase:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      MRxPhase configuration for internal SPI sampling timing.

required:
  - compatible
  - reg
  - interrupts
  - clocks

unevaluatedProperties: false

patternProperties:
  "^spi@[0-9a-f]+$":
    $ref: /schemas/spi/spi-device.yaml#

examples:
  - |
    spi: spi@b0061000 {
        compatible = "nuvoton,nuc990-spi";
        reg = <0xb0060000 0x1000>;
        interrupts = <48 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&clk SPI0_GATE>;

        num-cs = <2>;
        lsb = <0>;
        sleep = <0>;
        txbitlen = <8>;
        bus-num = <0>;
        spimode = <0>;
        mrxphase = <0>;

        #address-cells = <1>;
        #size-cells = <0>;

        flash@0 {
            compatible = "spi-nand";
            reg = <0>;
            spi-max-frequency = <30000000>;
        };

        spi@1 {
            compatible = "semtech,sx1301";
            reg = <1>;
            spi-max-frequency = <12000000>;
        };
    };

