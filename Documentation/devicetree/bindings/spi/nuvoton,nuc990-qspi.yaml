%YAML 1.2
---
$id: "http://devicetree.org/schemas/spi/nuvoton,nuc990-qspi.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Nuvoton NUC990 Quad SPI (QSPI) Controller

maintainers:
  - name: Chi-Wen Weng
    email: cwweng@nuvoton.com

description: |
  The Nuvoton NUC990 QSPI controller supports single, dual and quad SPI
  transfer modes and can be used to interface with SPI NOR or SPI NAND
  flash devices as well as generic SPI peripherals.

  The controller supports up to two chip selects and integrates with
  the Linux SPI controller and SPI-mem frameworks.

allOf:
  - $ref: /schemas/spi/spi-controller.yaml#

properties:
  compatible:
    const: nuvoton,nuc990-qspi

  reg:
    maxItems: 1
    description:
      Base address and size of the QSPI controller registers.

  interrupts:
    maxItems: 1
    description:
      QSPI controller interrupt.

  clocks:
    maxItems: 1
    description:
      QSPI functional clock.

  clock-names:
    items:
      - const: qspi
    description:
      Name of the QSPI clock.

  num-cs:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
    maximum: 2
    default: 2
    description:
      Number of supported chip selects.

  lsb:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]
    default: 0
    description:
      Set to 1 to enable LSB-first transfer.

  sleep:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Sleep cycle configuration for the QSPI controller.

  txbitlen:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [8, 16, 32]
    default: 8
    description:
      SPI transfer word length in bits.

  bus-num:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      SPI bus number.

  spimode:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Default SPI mode (0-3).

  quad:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]
    default: 0
    description:
      Enable quad mode capability.

  mrxphase:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      MRxPhase configuration for internal QSPI sampling timing.

required:
  - compatible
  - reg
  - interrupts
  - clocks

unevaluatedProperties: false

patternProperties:
  "^spi@[0-9a-f]+$":
    $ref: /schemas/spi/spi-device.yaml#

examples:
  - |
    qspi: qspi@b0060000 {
        compatible = "nuvoton,nuc990-qspi";
        reg = <0xb0060000 0x1000>;
        interrupts = <47 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&clk QSPI0_GATE>;

        num-cs = <2>;
        lsb = <0>;
        sleep = <0>;
        txbitlen = <8>;
        quad = <0>;
        bus-num = <0>;
        spimode = <0>;
        mrxphase = <0>;

        #address-cells = <1>;
        #size-cells = <0>;

        flash@0 {
            compatible = "spi-nand";
            reg = <0>;
            spi-max-frequency = <30000000>;
        };

        spi@1 {
            compatible = "semtech,sx1301";
            reg = <1>;
            spi-max-frequency = <12000000>;
        };
    };

